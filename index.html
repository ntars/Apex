<!-- ==================== 内联脚本：项目卡片渲染 / 弹窗 / 设备检测 / 打字效果 ==================== -->
<script>
    // ==================== 项目卡片：数据驱动渲染 ====================
    // 箭头图标只定义一次（内联 SVG，currentColor 着色），卡片由配置数组生成，
    // DOM 结构与类名和原静态写法完全一致，样式层零改动。
    (function() {
        // 状态口径：以项目现状描述为准，未上线内容不出现在链接与文案中
        var PROJECTS = [
            {
                title: '玄玖灵犀 Xael',
                desc: '本地离线的术数文献库，微信小程序与公众号同名 · 产品已上线',
                href: 'https://x.ntars.cn/',
                icon: null  // 官网图标备好后挂载
            },
            {
                title: '元鸣 Ondra',
                desc: '可一键部署、高度自定义的 AI 陪伴体 · 产品内测中',
                href: 'https://ai.ntars.cn/',
                icon: { src: 'assets/img/dpet-icon.svg', alt: '元鸣 Ondra 图标' }
            }
        ];

        var ARROW_SVG =
            '<svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 14 14" fill="none">' +
            '<path d="M10.55 7.58332H1.16663V6.41665H10.55L7.75415 3.62082L8.5791 2.79587L12.1645 6.3813C12.5062 6.72299 12.5062 7.27701 12.1645 7.61873L8.5791 11.2042L7.75415 10.3792L10.55 7.58332Z" fill="currentColor"></path>' +
            '</svg>';

        var list = document.getElementById('project-cards');
        if (!list) return;

        PROJECTS.forEach(function(p) {
            var item = document.createElement('div');
            item.className = 'magical link-card-item';

            var a = document.createElement('a');
            a.href = p.href;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';

            var info = document.createElement('div');
            info.className = 'info';
            var t = document.createElement('div');
            t.className = 'info-title';
            t.textContent = p.title;
            var d = document.createElement('div');
            d.className = 'info-desc';
            d.textContent = p.desc;
            info.appendChild(t);
            info.appendChild(d);
            a.appendChild(info);

            if (p.icon) {
                var img = document.createElement('img');
                img.src = p.icon.src;
                img.alt = p.icon.alt;
                img.width = 40;
                img.height = 40;
                a.appendChild(img);
            }

            var arrow = document.createElement('div');
            arrow.className = 'icon icon-arrow';
            arrow.innerHTML = ARROW_SVG;
            a.appendChild(arrow);

            item.appendChild(a);
            list.appendChild(item);
        });
    })();

    // ==================== 联系我们弹窗控制 ====================
    (function() {
        var modal = document.getElementById('contact-modal');
        var card = document.getElementById('contact-card');
        var closeBtn = document.getElementById('contact-modal-close');
        var panel = modal ? modal.querySelector('.contact-modal-panel') : null;
        if (!modal || !card) return;

        var lastFocus = null;

        // 滚动条宽度补偿：锁滚动条时给 body 加等宽 padding，避免内容横向位移（跳动）
        var scrollBarW = 0;
        var bodyPaddingRight = '';
        var bodyOverflow = '';

        function lockScroll() {
            bodyPaddingRight = document.body.style.paddingRight;
            bodyOverflow = document.body.style.overflow;
            scrollBarW = window.innerWidth - document.documentElement.clientWidth;
            document.body.style.overflow = 'hidden';
            if (scrollBarW > 0) {
                document.body.style.paddingRight = scrollBarW + 'px';
            }
        }

        function unlockScroll() {
            document.body.style.overflow = bodyOverflow;
            document.body.style.paddingRight = bodyPaddingRight;
        }

        function openModal() {
            lastFocus = document.activeElement;
            modal.hidden = false;
            lockScroll();
            // 触发过渡动画
            requestAnimationFrame(function() {
                requestAnimationFrame(function() {
                    modal.classList.add('is-open');
                });
            });
            card.classList.add('is-hidden');
            if (closeBtn) closeBtn.focus();
        }

        function closeModal() {
            modal.classList.remove('is-open');
            // 面板动画结束后再收起容器并恢复滚动条，
            // 避免提前解锁导致滚动条消失、页面横向位移（视觉上"跳动"一下）
            var target = panel || modal;
            var finished = false;
            var finish = function() {
                if (finished) return;
                finished = true;
                target.removeEventListener('transitionend', onEnd);
                clearTimeout(fallback);
                modal.hidden = true;
                unlockScroll();
                card.classList.remove('is-hidden');
            };
            var onEnd = function(e) {
                // 面板退出只过渡 opacity（transform 不参与过渡），故监听 opacity
                if (e.target !== target || e.propertyName !== 'opacity') return;
                finish();
            };
            target.addEventListener('transitionend', onEnd);
            // 兜底：若动画被跳过（如 prefers-reduced-motion），延时后直接收起
            var fallback = setTimeout(function() {
                if (!modal.classList.contains('is-open')) finish();
            }, 500);
            if (lastFocus && lastFocus.focus) lastFocus.focus();
        }

        card.addEventListener('click', openModal);
        card.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); openModal(); }
        });

        if (closeBtn) {
            closeBtn.addEventListener('click', closeModal);
            closeBtn.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); closeModal(); }
            });
        }

        // 点击遮罩关闭
        modal.querySelectorAll('[data-contact-close]').forEach(function(el) {
            el.addEventListener('click', closeModal);
        });

        // ESC 关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape' && !modal.hidden) closeModal();
        });

        // 纯文本联系方式（邮箱/QQ/微信）：点击或回车复制到剪贴板，不跳转
        // 安全模块屏蔽了选中/复制事件，这里用 Clipboard API 手动写入并给出反馈
        function copyText(text, el) {
            var v = el.querySelector('.contact-item-value');
            var feedback = function(ok) {
                if (!v || v.dataset.copied) return;
                var original = v.textContent;
                v.dataset.copied = '1';
                v.textContent = ok ? '已复制' : '复制失败';
                setTimeout(function() { v.textContent = original; delete v.dataset.copied; }, 1200);
            };
            if (navigator.clipboard && navigator.clipboard.writeText) {
                navigator.clipboard.writeText(text).then(function() { feedback(true); })
                    .catch(function() { feedback(false); });
            } else {
                feedback(false);
            }
        }

        modal.querySelectorAll('[data-contact-copy]').forEach(function(el) {
            var trigger = function() { copyText(el.getAttribute('data-contact-copy'), el); };
            el.addEventListener('click', trigger);
            el.addEventListener('keydown', function(e) {
                if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); trigger(); }
            });
        });
    })();

    // ==================== 设备检测与彩蛋切换功能 ====================
    (function() {
        var isPhone = window.innerWidth < 768;
        var isTablet = window.innerWidth >= 768 && window.innerWidth <= 1180 &&
                       ('ontouchstart' in window || navigator.maxTouchPoints > 0);
        var isDesktop = !isPhone && !isTablet;

        var greetingTitle = document.getElementById('greeting-title');
        var titleHi = greetingTitle.querySelector('.title-hi');
        var titleName = greetingTitle.querySelector('.title-name');
        var isAnimating = false;
        var currentMode = isDesktop ? 'studio' : (isTablet ? ((window.innerWidth > window.innerHeight) ? 'studio' : 'person') : 'person');

        function updateGreeting(mode) {
            if (mode === 'studio') {
                titleHi.textContent = 'Hi, We\'re';
                titleName.textContent = 'Ntarstudio';
            } else {
                titleHi.textContent = 'Hi, I\'m';
                titleName.textContent = 'Ntars';
            }
        }

        updateGreeting(currentMode);

        function animateSwitch(newMode) {
            if (isAnimating || newMode === currentMode) return;
            isAnimating = true;
            greetingTitle.classList.add('fade-out');
            greetingTitle.classList.remove('fade-in');
            setTimeout(function() {
                currentMode = newMode;
                updateGreeting(currentMode);
                greetingTitle.classList.remove('fade-out');
                greetingTitle.classList.add('fade-in');
                setTimeout(function() {
                    greetingTitle.classList.remove('fade-in');
                    isAnimating = false;
                }, 300);
            }, 300);
        }

        greetingTitle.addEventListener('click', function() {
            if (isTablet) return;
            animateSwitch(currentMode === 'studio' ? 'person' : 'studio');
        });

        function handleResize() {
            var newPhone = window.innerWidth < 768;
            var newTablet = window.innerWidth >= 768 && window.innerWidth <= 1180 &&
                            ('ontouchstart' in window || navigator.maxTouchPoints > 0);
            var newDesktop = !newPhone && !newTablet;

            if (newTablet && !isTablet) {
                isPhone = newPhone; isTablet = newTablet; isDesktop = newDesktop;
                animateSwitch((window.innerWidth > window.innerHeight) ? 'studio' : 'person');
                return;
            }
            if (!newTablet && isTablet) {
                isPhone = newPhone; isTablet = newTablet; isDesktop = newDesktop;
                animateSwitch(isDesktop ? 'studio' : 'person');
                return;
            }

            if (isTablet) {
                var newLandscape = window.innerWidth > window.innerHeight;
                animateSwitch(newLandscape ? 'studio' : 'person');
            }

            isPhone = newPhone; isTablet = newTablet; isDesktop = newDesktop;

            var themeMeta = document.querySelector('meta[name=theme-color]');
            if (themeMeta) {
                var theme = document.documentElement.getAttribute('data-theme');
                themeMeta.setAttribute('content', theme === 'dark' ? '#0E0E13' : '#E8EEFA');
            }
        }

        if (isTablet) {
            window.addEventListener('resize', handleResize);
            window.addEventListener('orientationchange', function() {
                setTimeout(handleResize, 200);
            });
        }

        window.addEventListener('resize', function() {
            var themeMeta = document.querySelector('meta[name=theme-color]');
            if (themeMeta) {
                var theme = document.documentElement.getAttribute('data-theme');
                themeMeta.setAttribute('content', theme === 'dark' ? '#0E0E13' : '#E8EEFA');
            }
        });
    })();

    // ==================== 打字效果（Typed.js） ====================
    var typedOptions = {
        strings: [
            ">_ Remember what is important ^1000",
            ">_ Forget what is painful ^1000",
        ],
        typeSpeed: 50,
        backSpeed: 20,
        startDelay: 300,
        loop: true,
        showCursor: false,
    };
    var typed = new Typed('#typed', typedOptions);
</script>

<script>

        window.addEventListener('load', function () {
            navigator.serviceWorker.register('./sw.js')
                .then(function (reg) {
                    console.log('[PWA] Service Worker registered:', reg.scope);
                    // 监听 SW 更新
                    reg.addEventListener('updatefound', function () {
                        var newWorker = reg.installing;
                        if (!newWorker) return;
                        newWorker.addEventListener('statechange', function () {
                            if (newWorker.state === 'installed' && navigator.serviceWorker.controller) {
                                console.log('[PWA] New version available, please refresh.');
                            }
                        });
                    });
                })
                .catch(function (err) {
                    console.log('[PWA] Service Worker registration failed:', err);
                });
        });
    }

    // ==================== PWA 安装提示（beforeinstallprompt） ====================
    // 监听浏览器原生 PWA 安装事件，允许用户将网页安装为桌面/主屏幕应用
    var deferredPrompt;
    window.addEventListener('beforeinstallprompt', function (e) {
        e.preventDefault();
        deferredPrompt = e;
        // Android Chrome / 部分桌面浏览器支持安装横幅
        // 此处预留自定义安装按钮逻辑，默认依赖浏览器原生 UI
        console.log('[PWA] Install prompt available');
    });

    // 检测是否已以 PWA 模式运行
    if (window.matchMedia('(display-mode: standalone)').matches) {
        console.log('[PWA] Running in standalone mode');
    }
</script>
